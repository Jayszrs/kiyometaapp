<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FactoryTrack Tablet</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --font-sans:'Inter';
    --font-mono:'JetBrains Mono';

    --neutral-900:#1c1a17; --neutral-800:#2a2723; --neutral-500:#8a8177;
    --neutral-400:#a8a096; --neutral-300:#c9c2b8; --neutral-50:#f5f3ef; --neutral-25:#faf9f6;

    --brand-brown-500:#8a5a3c;
    --brand-red-50:#fdf0ee; --brand-red-200:#f2c7bd; --brand-red-500:#d1503a;
    --brand-red-600:#c0392b; --brand-red-700:#a12f22;

    --surface-app:#edeae4; --surface-card:#ffffff; --surface-hover:#f6f4f0;
    --surface-active:#efece6; --surface-sunken:#e7e3dc; --surface-brand:#8a5a3c;
    --surface-brand-hover:#764a30;

    --border-strong:#cec7bb; --border-default:#ddd6ca; --border-subtle:#eae4da; --border-nav:#3b3730;

    --text-strong:#201e1a; --text-body:#3a352f; --text-muted:#7a7268; --text-subtle:#9a9288;
    --text-link:#8a5a3c; --text-link-hover:#764a30;

    --green-50:#eef7ef; --green-500:#3f9d54; --green-600:#2f7d41;
    --blue-50:#eef3fb; --blue-500:#3b74c4; --blue-600:#2f5da0;
    --amber-50:#fdf5e8; --amber-100:#f7e5c2; --amber-500:#d9962b; --amber-600:#b07414;
    --violet-50:#f2effb; --violet-500:#6d5bc4;

    --status-progress-bg:#fdf5e8; --status-progress-fg:#b07414; --status-progress-dot:#d9962b;
    --status-resolved-bg:#eef7ef; --status-resolved-fg:#2f7d41; --status-resolved-dot:#3f9d54;
    --status-pending-bg:#f2effb; --status-pending-fg:#6d5bc4; --status-pending-dot:#6d5bc4;
    --status-closed-bg:#f0eee9; --status-closed-fg:#7a7268; --status-closed-dot:#a8a096;

    --shadow-sm:0 1px 2px rgba(30,25,18,.06),0 1px 3px rgba(30,25,18,.05);
    --shadow-md:0 4px 14px rgba(30,25,18,.10);
    --shadow-lg:0 14px 40px rgba(30,25,18,.22);
    --transition-control:all .15s ease;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--surface-app);
    font-family:var(--font-sans),system-ui,-apple-system,sans-serif;
    color:var(--text-body);
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;
    user-select:none;
  }
  button,textarea{font-family:inherit}
  a{color:var(--text-link)} a:hover{color:var(--text-link-hover)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}

  .stage{display:flex;justify-content:center;align-items:flex-start;padding:24px;min-height:100vh}
  .frame{
    width:1280px;height:800px;display:flex;flex-direction:column;flex:none;
    background:var(--surface-app);border:1px solid var(--border-strong);
    box-shadow:var(--shadow-md);overflow:hidden;position:relative;
  }
  #frame{display:flex;flex-direction:column;height:100%}

  .spin{display:inline-flex;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  i[data-lucide]{display:inline-block;vertical-align:middle}
  svg.lucide{display:inline-block;vertical-align:middle;stroke-width:2}

  /* hover helpers */
  .nav-btn:hover{background:var(--surface-hover)}
  .tile-brand:hover{background:var(--surface-brand-hover)}
  .tile-card:hover{background:var(--surface-hover);border-color:var(--border-strong)}
  .simbtn:hover{background:var(--surface-hover);border-color:var(--border-strong)}
  .btn-brand:hover{background:var(--surface-brand-hover)}
  .btn-soft:hover{background:var(--surface-hover);border-color:var(--border-strong)}
  .btn-soft2:hover{background:var(--surface-hover)}
  .btn-danger-ghost:hover{background:var(--brand-red-50);border-color:var(--brand-red-200)}
  .btn-red:hover{background:var(--brand-red-700)}
  .btn-bright:hover{filter:brightness(.92)}
  .qtybtn:hover{background:var(--surface-active)}
  .roletab{transition:var(--transition-control)}

  @media (max-width:1360px){ .stage{align-items:flex-start} }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <div id="frame"></div>
    <div id="toast" hidden></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var pad = function(n){ return String(n).padStart(2,'0'); };

  var STEP_DEFS = [
    { seq:'01', name:'Cutting',   operator:'Rizky Pratama',    start:'07.12', finish:'08.04', duration:'52m' },
    { seq:'02', name:'Drilling',  operator:'Rizky Pratama',    start:'08.10', finish:'09.01', duration:'51m' },
    { seq:'03', name:'Welding',   operator:'Rizky Pratama',    start:'09.08', finish:'',      duration:'' },
    { seq:'04', name:'Finishing', operator:'Sri Handayani',    start:'',      finish:'',      duration:'' },
    { seq:'05', name:'QC',        operator:'Dewi Anggraini',   start:'',      finish:'',      duration:'' }
  ];

  var ROLES = [
    { key:'operator', label:'Operator', line:'OPERATOR · SHIFT 1', screens:['home','job','progress'] },
    { key:'gudang',   label:'Gudang',   line:'GUDANG · SHIFT 1',   screens:['home','material'] },
    { key:'admin',    label:'Admin',    line:'ADMIN PRODUKSI',          screens:['home','job','progress','material'] }
  ];

  var NAV = [
    { key:'home',     label:'Dasbor',        icon:'layout-grid' },
    { key:'job',      label:'Scan job',      icon:'scan-barcode' },
    { key:'progress', label:'Produksi',      icon:'list-checks' },
    { key:'material', label:'Scan material', icon:'package-check' }
  ];

  var JOB = {
    no:'JOB-2026-0914', customer:'PT Samakta Mitra', product:'Bracket Assembly A-220',
    order:'SO-88412', target:'1.500', done:'940', pct:63, pctWidth:'63%',
    operation:'Welding (3/5)', elapsed:'2j 34m', remaining:'560',
    date:'06 Sep 2026', startTime:'07.12 WIB'
  };
  var MATERIAL = { code:'MAT-4471-B', name:'Pelat baja 2mm SPHC', stock:'1.240 SHT', unit:'SHT' };

  var JOB_TITLES = {
    idle:     ['Siap men-scan', 'Arahkan scanner ke barcode kartu job.'],
    scanning: ['Membaca barcode…', 'Tahan kartu job stabil di dalam bingkai.'],
    found:    ['Job ditemukan', 'Data diambil dari master job. Pilih tindakan di sebelah kanan.'],
    notfound: ['Kode tidak dikenali', 'Barcode terbaca, tetapi tidak ada di master job.'],
    active:   ['Job sedang aktif', 'Job ini sedang dikerjakan di stasiun lain.']
  };
  var MAT_TITLES = {
    idle:     ['Siap men-scan', 'Arahkan scanner ke label material.'],
    scanning: ['Membaca label…', 'Tahan label stabil di dalam bingkai.'],
    found:    ['Material ditemukan', 'Stok dan satuan diambil dari master material.'],
    notfound: ['Kode tidak dikenali', 'Label terbaca, tetapi tidak ada di master material.']
  };

  var state = {
    screen:'home', role:'admin',
    jobScan:'found', matScan:'idle',
    now:new Date(2026, 8, 6, 9, 46, 12),
    currentStep:2, running:true, stepSeconds:2288,
    qty:6, notes:'', toast:null, queue:3, online:true
  };

  var scanTimer, toastTimer;
  var $ = function(s, r){ return (r||document).querySelector(s); };

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
    });
  }
  function hms(total){
    var h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
    return pad(h)+':'+pad(m)+':'+pad(s);
  }
  function roleObj(){ return ROLES.filter(function(r){ return r.key===state.role; })[0]; }
  function operatorName(){
    return state.role==='gudang' ? 'Bagus Setiawan'
         : state.role==='admin'  ? 'Dewi Anggraini'
         : 'Rizky Pratama';
  }
  function initials(name){
    return name.split(' ').map(function(w){ return w[0]; }).slice(0,2).join('');
  }
  function clockStr(){
    var d = state.now;
    return pad(d.getHours())+'.'+pad(d.getMinutes())+'.'+pad(d.getSeconds())+' WIB';
  }
  function ic(name, size, color){
    return '<i data-lucide="'+name+'" width="'+size+'" height="'+size+'"'+
      (color ? ' style="color:'+color+'"' : '')+'></i>';
  }
  function frameStyle(mode){
    var map = {
      found:    { c:'var(--green-500)',     bg:'var(--green-50)',     icon:'circle-check' },
      scanning: { c:'var(--blue-500)',      bg:'var(--blue-50)',      icon:'loader-circle' },
      notfound: { c:'var(--brand-red-500)', bg:'var(--brand-red-50)', icon:'circle-alert' },
      active:   { c:'var(--amber-500)',     bg:'var(--amber-50)',     icon:'triangle-alert' }
    };
    var m = map[mode];
    if (!m) return { border:'var(--border-default)', bg:'var(--neutral-50)', fg:'var(--neutral-300)', icon:'scan-barcode' };
    return { border:m.c, bg:m.bg, fg:m.c, icon:m.icon };
  }
  function codeFor(mode, code){
    return mode==='found' ? code
         : mode==='scanning' ? '· · · · ·'
         : mode==='notfound' ? 'JOB-2026-9###'
         : mode==='active' ? 'JOB-2026-0908'
         : '';
  }

  var TOUCH_H = '56px', TOUCH_HLG = '64px', TOUCH_HXL = '68px', STEP_ROW_H = '58px';
  var FONT_MONO = '500 13.5px/1.3 var(--font-mono)';
  var FONT_SANS = '500 13.5px/1.3 var(--font-sans)';

  /* ---------------- header ---------------- */
  function headerHtml(){
    var online = state.online;
    var name = operatorName();
    var connDot = online ? 'var(--green-500)' : 'var(--amber-500)';
    var connLabel = online ? 'Online' : 'Offline — '+state.queue+' antrean';
    return ''+
    '<header style="height:64px;flex:none;background:var(--neutral-900);display:flex;align-items:center;padding:0 24px;gap:20px">'+
      '<div style="background:#fff;border-radius:4px;padding:6px 10px">'+
        '<div style="font:600 15px/1.1 var(--font-sans);letter-spacing:-.011em;color:var(--neutral-900)">FactoryTrack</div>'+
        '<div style="font:400 8.5px/1.3 var(--font-mono);letter-spacing:.07em;color:var(--neutral-500);text-transform:uppercase;margin-top:1px">OneSmartServices</div>'+
      '</div>'+
      '<div style="width:1px;height:30px;background:var(--border-nav)"></div>'+
      '<div style="font:400 12px/1.4 var(--font-mono);letter-spacing:.05em;color:var(--neutral-400)">LINE 02 · STASIUN W-04</div>'+
      '<div style="margin-left:auto;display:flex;align-items:center;gap:18px">'+
        '<button data-act="toggleConn" title="Klik untuk simulasi online/offline" style="display:flex;align-items:center;gap:8px;background:transparent;border:0;cursor:pointer;padding:4px 6px;border-radius:6px">'+
          '<span style="width:8px;height:8px;border-radius:999px;background:'+connDot+'"></span>'+
          '<span style="font:500 13px/1 var(--font-sans);color:'+connDot+'">'+connLabel+'</span>'+
        '</button>'+
        '<div style="width:1px;height:24px;background:var(--border-nav)"></div>'+
        '<div style="text-align:right">'+
          '<div class="js-clock" style="font:500 15px/1.1 var(--font-mono);color:#fff;letter-spacing:.02em">'+clockStr()+'</div>'+
          '<div style="font:400 10px/1.3 var(--font-mono);color:var(--neutral-500);letter-spacing:.04em">Sabtu, 06 Sep 2026</div>'+
        '</div>'+
        '<div style="width:1px;height:24px;background:var(--border-nav)"></div>'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<div style="width:34px;height:34px;flex:none;border-radius:999px;background:var(--brand-brown-500);color:#fff;display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--font-sans)">'+esc(initials(name))+'</div>'+
          '<div>'+
            '<div style="font:500 13px/1.2 var(--font-sans);color:#fff">'+esc(name)+'</div>'+
            '<div style="font:400 11px/1.3 var(--font-mono);color:var(--neutral-500);letter-spacing:.03em">'+roleObj().line+'</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</header>';
  }

  /* ---------------- nav + role tabs ---------------- */
  function navHtml(){
    var items = NAV.filter(function(n){ return roleObj().screens.indexOf(n.key) !== -1; });
    var buttons = items.map(function(n){
      var active = state.screen === n.key;
      var rule = active ? '2px solid var(--brand-red-600)' : '2px solid transparent';
      var fg = active ? 'var(--text-strong)' : 'var(--text-muted)';
      var fw = active ? '600' : '400';
      return '<button class="nav-btn" data-act="go" data-arg="'+n.key+'" style="display:flex;align-items:center;gap:10px;height:100%;padding:0 18px;border:0;border-bottom:'+rule+';background:transparent;color:'+fg+';font:'+fw+' 15px/1 var(--font-sans);cursor:pointer;transition:var(--transition-control)">'+
        ic(n.icon, 19)+'<span>'+n.label+'</span></button>';
    }).join('');

    var tabs = ROLES.map(function(r){
      var on = state.role === r.key;
      var bg = on ? 'var(--neutral-900)' : 'var(--surface-card)';
      var fg = on ? '#fff' : 'var(--text-muted)';
      var fw = on ? '500' : '400';
      return '<button class="roletab" data-act="role" data-arg="'+r.key+'" style="height:36px;padding:0 14px;border:0;background:'+bg+';color:'+fg+';font:'+fw+' 13px/1 var(--font-sans);cursor:pointer">'+r.label+'</button>';
    }).join('');

    return ''+
    '<div style="height:60px;flex:none;background:var(--surface-card);border-bottom:1px solid var(--border-subtle);display:flex;align-items:stretch;padding:0 24px;gap:4px">'+
      buttons+
      '<div style="margin-left:auto;display:flex;align-items:center;gap:14px">'+
        '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Peran</div>'+
        '<div style="display:flex;border:1px solid var(--border-default);border-radius:6px;overflow:hidden">'+tabs+'</div>'+
      '</div>'+
    '</div>';
  }

  function statusPill(bg, fg, dot, label){
    return '<span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:4px;background:'+bg+';color:'+fg+';font:500 12px/1 var(--font-sans)">'+
      '<span style="width:6px;height:6px;border-radius:999px;background:'+dot+'"></span>'+label+'</span>';
  }

  /* ---------------- HOME ---------------- */
  function screenHome(){
    var online = state.online;
    var curName = (STEP_DEFS[state.currentStep] || STEP_DEFS[STEP_DEFS.length-1]).name;

    var summary = [
      { label:'Job hari ini',   value:'7',     unit:'job', note:'1 berjalan · 4 selesai', noteFg:'var(--text-muted)' },
      { label:'Output hari ini', value:'2.140', unit:'pcs', note:'87% dari rencana', noteFg:'var(--amber-600)' },
      { label:'Issue material',  value:'12',    unit:'trx', note: online ? 'Semua terkirim' : state.queue+' menunggu antrean', noteFg: online ? 'var(--green-600)' : 'var(--amber-600)' },
      { label:'Scrap',           value:'18',    unit:'pcs', note:'0,8% — di atas target 0,5%', noteFg:'var(--brand-red-600)' }
    ];

    var S = {
      done:  { s:'Selesai',  bg:'var(--status-resolved-bg)', fg:'var(--status-resolved-fg)', dot:'var(--status-resolved-dot)' },
      run:   { s:'Berjalan', bg:'var(--status-progress-bg)', fg:'var(--status-progress-fg)', dot:'var(--status-progress-dot)' },
      hold:  { s:'Ditahan',  bg:'var(--status-pending-bg)',  fg:'var(--status-pending-fg)',  dot:'var(--status-pending-dot)' },
      closed:{ s:'Ditutup',  bg:'var(--status-closed-bg)',   fg:'var(--status-closed-fg)',   dot:'var(--status-closed-dot)' }
    };
    var activity = [
      { time:'09.08', job:'JOB-2026-0914', event:'Welding dimulai', operator:'Rizky Pratama', k:S.run },
      { time:'09.02', job:'JOB-2026-0914', event:'Material di-issue — MAT-4471-B · 6 SHT', operator:'Bagus Setiawan', k:S.done },
      { time:'09.01', job:'JOB-2026-0914', event:'Drilling selesai — 940 pcs baik', operator:'Rizky Pratama', k:S.done },
      { time:'08.46', job:'JOB-2026-0908', event:'QC menahan — dimensi di luar toleransi', operator:'Dewi Anggraini', k:S.hold },
      { time:'08.12', job:'JOB-2026-0911', event:'Job selesai — 500 / 500 pcs', operator:'Sri Handayani', k:S.closed },
      { time:'07.12', job:'JOB-2026-0914', event:'Job dimulai — di-scan di W-04', operator:'Rizky Pratama', k:S.done }
    ];

    var summaryCards = summary.map(function(m){
      return '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);padding:14px 18px">'+
        '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">'+m.label+'</div>'+
        '<div style="display:flex;align-items:baseline;gap:6px;margin-top:7px">'+
          '<span style="font:500 25px/1 var(--font-mono);color:var(--text-strong);letter-spacing:-.01em">'+m.value+'</span>'+
          '<span style="font:400 12px/1 var(--font-sans);color:var(--text-muted)">'+m.unit+'</span>'+
        '</div>'+
        '<div style="font:400 12px/1.4 var(--font-sans);color:'+m.noteFg+';margin-top:5px">'+m.note+'</div>'+
      '</div>';
    }).join('');

    var activityRows = activity.map(function(r){
      return '<div style="display:grid;grid-template-columns:90px 156px 1fr 150px 124px;padding:0 18px;height:44px;align-items:center;border-bottom:1px solid var(--border-subtle);font:400 13px/1.3 var(--font-sans);color:var(--text-body)">'+
        '<div style="font-family:var(--font-mono);color:var(--text-muted);font-size:12px">'+r.time+'</div>'+
        '<div style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-strong)">'+r.job+'</div>'+
        '<div>'+r.event+'</div>'+
        '<div style="color:var(--text-muted)">'+r.operator+'</div>'+
        '<div>'+statusPill(r.k.bg, r.k.fg, r.k.dot, r.k.s)+'</div>'+
      '</div>';
    }).join('');

    return ''+
    '<div style="display:flex;flex-direction:column;gap:14px;height:100%">'+
      '<div style="display:grid;grid-template-columns:1.3fr 1.3fr 1fr;gap:14px">'+
        '<button class="tile-brand" data-act="go" data-arg="job" style="display:flex;flex-direction:column;justify-content:space-between;height:132px;padding:18px;border:1px solid transparent;border-radius:8px;background:var(--surface-brand);color:#fff;cursor:pointer;text-align:left;transition:var(--transition-control)">'+
          ic('scan-barcode', 32)+
          '<div><div style="font:600 21px/1.15 var(--font-sans);letter-spacing:-.011em">Scan job</div>'+
          '<div style="font:400 13px/1.4 var(--font-sans);margin-top:4px;color:#fff">Mulai, lanjutkan, atau selesaikan job produksi</div></div>'+
        '</button>'+
        '<button class="tile-card" data-act="go" data-arg="material" style="display:flex;flex-direction:column;justify-content:space-between;height:132px;padding:18px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-card);cursor:pointer;text-align:left;box-shadow:var(--shadow-sm);transition:var(--transition-control)">'+
          ic('package-check', 32, 'var(--brand-brown-500)')+
          '<div><div style="font:600 21px/1.15 var(--font-sans);letter-spacing:-.011em;color:var(--text-strong)">Scan material</div>'+
          '<div style="font:400 13px/1.4 var(--font-sans);margin-top:4px;color:var(--text-muted)">Issue material ke job yang sedang berjalan</div></div>'+
        '</button>'+
        '<button class="tile-card" data-act="go" data-arg="progress" style="display:flex;flex-direction:column;justify-content:space-between;height:132px;padding:18px;border:1px solid var(--border-default);border-radius:8px;background:var(--surface-card);cursor:pointer;text-align:left;box-shadow:var(--shadow-sm);transition:var(--transition-control)">'+
          ic('list-checks', 28, 'var(--blue-600)')+
          '<div><div style="font:600 17px/1.15 var(--font-sans);letter-spacing:-.011em;color:var(--text-strong)">Progres job</div>'+
          '<div style="font:400 12px/1.4 var(--font-sans);margin-top:4px;color:var(--text-muted)">1 job berjalan · '+curName+'</div></div>'+
        '</button>'+
      '</div>'+

      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">'+summaryCards+'</div>'+

      '<div style="flex:1;min-height:0;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden">'+
        '<div style="display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border-subtle)">'+
          '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Aktivitas terakhir</div>'+
          '<div style="margin-left:auto;font:400 12px/1 var(--font-mono);color:var(--text-muted)">Tercatat otomatis · tanpa input manual</div>'+
        '</div>'+

  /* ---------------- JOB ---------------- */
  function screenJob(){
    var jf = frameStyle(state.jobScan);
    var titles = JOB_TITLES[state.jobScan] || JOB_TITLES.idle;

    var codeFg = state.jobScan==='found' ? 'var(--green-600)'
               : state.jobScan==='notfound' ? 'var(--brand-red-600)'
               : state.jobScan==='active' ? 'var(--amber-600)' : 'var(--text-subtle)';
    var scanning = state.jobScan==='scanning';

    var simButtons = [
      { label:'Job valid',        fg:'var(--green-600)',     arg:'found' },
      { label:'Tidak ditemukan',  fg:'var(--brand-red-600)', arg:'notfound' },
      { label:'Sudah aktif',      fg:'var(--amber-600)',     arg:'active' }
    ].map(function(b){
      return '<button class="simbtn" data-act="scanJob" data-arg="'+b.arg+'" style="height:'+TOUCH_H+';padding:0 6px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:'+b.fg+';font:500 12.5px/1.25 var(--font-sans);cursor:pointer;transition:var(--transition-control)">'+b.label+'</button>';

    var left = ''+
    '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden">'+
      '<div style="padding:13px 18px;border-bottom:1px solid var(--border-subtle);font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Barcode job</div>'+
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px">'+
        '<div style="width:230px;height:142px;border:2px solid '+jf.border+';border-radius:6px;background:'+jf.bg+';display:flex;align-items:center;justify-content:center;transition:var(--transition-control)">'+
          '<span class="'+(scanning?'spin':'')+'">'+ic(jf.icon, 50, jf.fg)+'</span>'+
        '</div>'+
        '<div style="text-align:center">'+
          '<div style="font:500 16px/1.3 var(--font-sans);color:'+titleFg+'">'+titles[0]+'</div>'+
          '<div style="font:400 13px/1.5 var(--font-sans);color:var(--text-muted);margin-top:4px;max-width:290px">'+titles[1]+'</div>'+
        '</div>'+
        '<div style="font:500 15px/1 var(--font-mono);letter-spacing:.06em;color:'+codeFg+';height:18px">'+codeFor(state.jobScan, JOB.no)+'</div>'+
      '</div>'+
      '<div style="padding:14px 18px;border-top:1px solid var(--border-subtle);background:var(--neutral-25);display:flex;flex-direction:column;gap:10px">'+
        '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Simulasi pembacaan barcode</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'+simButtons+'</div>'+
        '<div style="font:400 11.5px/1.5 var(--font-sans);color:var(--text-subtle)">Di perangkat asli, ketiga hasil ini datang dari scanner. Data job dibaca dari master data — tidak ada yang diketik.</div>'+
      '</div>'+
    '</div>';

    var right;
    if (state.jobScan === 'found') {
      var jobFields = [
        { label:'Nomor job',           value:JOB.no,                 font:FONT_MONO },
        { label:'Nomor order',         value:JOB.order,              font:FONT_MONO },
        { label:'Pelanggan',           value:JOB.customer,           font:FONT_SANS },
        { label:'Produk',              value:JOB.product,            font:FONT_SANS },
        { label:'Jenis produk',        value:'Bracket pelat baja',   font:FONT_SANS },
        { label:'Jenis operasi',       value:'Welding — MIG',   font:FONT_SANS },
        { label:'Kuantitas target',    value:JOB.target+' pcs',      font:FONT_MONO },
        { label:'Kuantitas selesai',   value:JOB.done+' pcs',        font:FONT_MONO },
        { label:'Operator',            value:operatorName(),         font:FONT_SANS },
        { label:'Jam mulai',           value:JOB.startTime,          font:FONT_MONO }
      ].map(function(f){
        return '<div style="display:grid;grid-template-columns:158px 1fr;align-items:center;gap:12px;height:40px;padding:0 18px;border-bottom:1px solid var(--border-subtle)">'+
          '<div style="font:400 12.5px/1.3 var(--font-sans);color:var(--text-muted)">'+f.label+'</div>'+
          '<div style="font:'+f.font+';color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(f.value)+'</div>'+
        '</div>';
      }).join('');

      right = ''+
      '<div style="min-width:0;display:flex;flex-direction:column;gap:14px;height:100%">'+
        '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);overflow:hidden">'+
          '<div style="display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--border-subtle)">'+
            '<div style="font:500 20px/1.1 var(--font-mono);letter-spacing:.01em;color:var(--text-strong)">'+JOB.no+'</div>'+
            statusPill('var(--status-progress-bg)','var(--status-progress-fg)','var(--status-progress-dot)','Berjalan')+
            '<div style="margin-left:auto;font:400 12px/1 var(--font-mono);color:var(--text-muted)">Mulai '+JOB.startTime+' · '+JOB.date+'</div>'+
          '</div>'+
          '<div style="display:grid;grid-template-columns:1fr 1fr">'+jobFields+'</div>'+
        '</div>'+

        '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);padding:16px 18px">'+
          '<div style="display:flex;align-items:baseline;gap:10px">'+
            '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Progres produksi</div>'+
            '<div style="margin-left:auto;font:500 15px/1 var(--font-mono);color:var(--text-strong)">'+JOB.done+' / '+JOB.target+' pcs</div>'+
            '<div style="font:500 15px/1 var(--font-mono);color:var(--amber-600)">'+JOB.pct+'%</div>'+
          '</div>'+
          '<div style="height:10px;border-radius:999px;background:var(--surface-sunken);margin-top:11px;overflow:hidden">'+
            '<div style="height:100%;width:'+JOB.pctWidth+';background:var(--amber-500);border-radius:999px"></div>'+
          '</div>'+
          '<div style="display:flex;gap:26px;margin-top:12px">'+
            '<div style="font:400 12.5px/1.4 var(--font-sans);color:var(--text-muted)">Operasi <span style="color:var(--text-strong);font-weight:500">'+JOB.operation+'</span></div>'+
            '<div style="font:400 12.5px/1.4 var(--font-sans);color:var(--text-muted)">Berjalan <span style="font-family:var(--font-mono);color:var(--text-strong)">'+JOB.elapsed+'</span></div>'+
            '<div style="font:400 12.5px/1.4 var(--font-sans);color:var(--text-muted)">Sisa <span style="font-family:var(--font-mono);color:var(--text-strong)">'+JOB.remaining+' pcs</span></div>'+
          '</div>'+
        '</div>'+

        '<div style="margin-top:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">'+
          '<button class="btn-brand" data-act="go" data-arg="progress" style="height:'+TOUCH_HLG+';border:1px solid transparent;border-radius:6px;background:var(--surface-brand);color:#fff;font:500 17px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:var(--transition-control)">'+ic('play',20)+'Lanjutkan job</button>'+
          '<button class="btn-soft" data-act="go" data-arg="material" style="height:'+TOUCH_HLG+';border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-body);font:500 17px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:var(--transition-control)">'+ic('package-plus',20)+'Issue material</button>'+
          '<button class="btn-danger-ghost" data-act="jobFinish" style="height:'+TOUCH_HLG+';border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--brand-red-600);font:500 17px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:var(--transition-control)">'+ic('square-check-big',20)+'Selesaikan job</button>'+
        '</div>'+
      '</div>';
    } else if (state.jobScan === 'notfound') {
      right = ''+
      '<div style="min-width:0;display:flex;flex-direction:column;height:100%">'+
        '<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-left:2px solid var(--brand-red-600);border-radius:8px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px">'+
          ic('circle-alert', 40, 'var(--brand-red-600)')+
          '<div style="font:600 20px/1.3 var(--font-sans);color:var(--text-strong);letter-spacing:-.011em">Job tidak ditemukan</div>'+
          '<div style="font:400 13.5px/1.6 var(--font-sans);color:var(--text-muted);text-align:center;max-width:400px">Kode <span style="font-family:var(--font-mono);color:var(--text-strong)">JOB-2026-9###</span> tidak ada di master data. Periksa kartu job atau minta supervisor menerbitkan ulang kartunya.</div>'+
          '<button class="btn-soft2" data-act="jobReset" style="height:'+TOUCH_H+';padding:0 26px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-body);font:500 15px/1 var(--font-sans);cursor:pointer">Scan ulang</button>'+
        '</div>'+
      '</div>';
    } else if (state.jobScan === 'active') {
      right = ''+
      '<div style="min-width:0;display:flex;flex-direction:column;height:100%">'+
        '<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-left:2px solid var(--amber-500);border-radius:8px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px">'+
          ic('triangle-alert', 40, 'var(--amber-500)')+
          '<div style="font:600 20px/1.3 var(--font-sans);color:var(--text-strong);letter-spacing:-.011em">Job sedang dikerjakan operator lain</div>'+
          '<div style="font:400 13.5px/1.6 var(--font-sans);color:var(--text-muted);text-align:center;max-width:420px"><span style="font-family:var(--font-mono);color:var(--text-strong)">JOB-2026-0908</span> aktif di stasiun W-02 oleh Bagus Setiawan sejak 08.31 WIB. Satu job hanya boleh berjalan di satu stasiun.</div>'+
          '<div style="display:flex;gap:12px">'+
            '<button class="btn-soft2" data-act="jobReset" style="height:'+TOUCH_H+';padding:0 24px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-body);font:500 15px/1 var(--font-sans);cursor:pointer">Scan job lain</button>'+
            '<button class="btn-red" data-act="jobTakeover" style="height:'+TOUCH_H+';padding:0 24px;border:1px solid transparent;border-radius:6px;background:var(--brand-red-600);color:#fff;font:500 15px/1 var(--font-sans);cursor:pointer">Minta alih stasiun</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    } else {
      right = ''+
      '<div style="min-width:0;display:flex;flex-direction:column;height:100%">'+
        '<div style="flex:1;background:var(--surface-card);border:1px dashed var(--border-default);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px">'+
          '<span class="'+(scanning?'spin':'')+'">'+ic(scanning?'loader-circle':'scan-search', 40, 'var(--neutral-300)')+'</span>'+
          '<div style="font:500 17px/1.3 var(--font-sans);color:var(--text-muted)">'+(scanning?'Menunggu data job…':'Belum ada job dimuat')+'</div>'+
          '<div style="font:400 13.5px/1.6 var(--font-sans);color:var(--text-subtle);text-align:center;max-width:380px">Scan barcode kartu job. Nomor job, pelanggan, produk, order, kuantitas, dan operator terisi otomatis.</div>'+
        '</div>'+
      '</div>';
    }

    return '<div style="display:grid;grid-template-columns:400px 1fr;gap:16px;height:100%">'+left+right+'</div>';
  }

  /* ---------------- PROGRESS ---------------- */
  function screenProgress(){
    var st = state;
    var routePct = Math.round((st.currentStep / STEP_DEFS.length) * 100);
    var curDef = STEP_DEFS[st.currentStep] || STEP_DEFS[STEP_DEFS.length-1];
    var curAccent = st.running ? 'var(--amber-500)' : 'var(--violet-500)';

    var rows = STEP_DEFS.map(function(s, i){
      var done = i < st.currentStep;
      var cur = i === st.currentStep;
      var running = cur && st.running;
      var times = done ? s.start+' — '+s.finish : (cur && s.start ? s.start+' — …' : '—');
      var duration = done ? s.duration : (cur ? hms(st.stepSeconds).slice(0,5) : '—');
      var status = done ? 'Selesai' : (cur ? (running ? 'Berjalan' : 'Jeda') : 'Menunggu');
      var bg = done ? 'var(--status-resolved-bg)' : (cur ? (running ? 'var(--status-progress-bg)' : 'var(--status-pending-bg)') : 'var(--status-closed-bg)');
      var fg = done ? 'var(--status-resolved-fg)' : (cur ? (running ? 'var(--status-progress-fg)' : 'var(--status-pending-fg)') : 'var(--status-closed-fg)');
      var dot = done ? 'var(--status-resolved-dot)' : (cur ? (running ? 'var(--status-progress-dot)' : 'var(--status-pending-dot)') : 'var(--status-closed-dot)');
      var rowBg = cur ? (running ? 'var(--amber-50)' : 'var(--violet-50)') : 'var(--surface-card)';
      var nameFont = cur ? '600 16px/1.2 var(--font-sans)' : '400 15px/1.2 var(--font-sans)';
      var nameFg = (done || cur) ? 'var(--text-strong)' : 'var(--text-muted)';
      var durFg = cur ? 'var(--amber-600)' : 'var(--text-muted)';

      return '<div style="display:grid;grid-template-columns:52px 1fr 150px 124px 92px 124px;padding:0 18px;min-height:'+STEP_ROW_H+';align-items:center;border-bottom:1px solid var(--border-subtle);background:'+rowBg+'">'+
        '<div style="font:500 14px/1 var(--font-mono);color:var(--text-subtle)">'+s.seq+'</div>'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<span style="width:9px;height:9px;border-radius:999px;background:'+dot+';flex:none"></span>'+
          '<span style="font:'+nameFont+';color:'+nameFg+';letter-spacing:-.006em">'+s.name+'</span>'+
        '</div>'+
        '<div style="font:400 13px/1.3 var(--font-sans);color:var(--text-muted)">'+s.operator+'</div>'+
        '<div style="font:400 12px/1.5 var(--font-mono);color:var(--text-muted)">'+times+'</div>'+
        '<div style="font:400 13px/1 var(--font-mono);color:'+durFg+'">'+duration+'</div>'+
        '<div><span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:4px;background:'+bg+';color:'+fg+';font:500 12.5px/1 var(--font-sans)">'+status+'</span></div>'+
      '</div>';
    }).join('');

    var stepStateLabel = st.running ? 'Berjalan' : 'Jeda';
    var stepPrimaryLabel = st.running ? 'Selesaikan langkah' : 'Mulai langkah';
    var stepPrimaryIcon = st.running ? 'square-check-big' : 'play';
    var stepPrimaryBg = st.running ? 'var(--brand-red-600)' : 'var(--green-500)';

    return ''+
    '<div style="display:flex;flex-direction:column;gap:14px;height:100%">'+
      '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);padding:13px 18px;display:flex;align-items:center;gap:20px">'+
        '<div>'+
          '<div style="font:500 19px/1.1 var(--font-mono);color:var(--text-strong)">'+JOB.no+'</div>'+
          '<div style="font:400 12.5px/1.4 var(--font-sans);color:var(--text-muted);margin-top:3px">'+JOB.product+' · '+JOB.customer+'</div>'+
        '</div>'+
        '<div style="width:1px;height:38px;background:var(--border-subtle)"></div>'+
        '<div>'+
          '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Operasi</div>'+
          '<div style="font:500 15px/1.2 var(--font-sans);color:var(--text-strong);margin-top:3px">Langkah '+(st.currentStep+1)+' dari '+STEP_DEFS.length+' · '+curDef.name+'</div>'+
        '</div>'+
        '<div style="margin-left:auto;text-align:right">'+
          '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Timer langkah</div>'+
          '<div class="js-step-timer" style="font:500 26px/1.1 var(--font-mono);color:'+(st.running?'var(--amber-600)':'var(--text-muted)')+';letter-spacing:.01em;margin-top:2px">'+hms(st.stepSeconds)+'</div>'+
        '</div>'+
      '</div>'+

      '<div style="display:grid;grid-template-columns:1fr 356px;gap:16px;flex:1;min-height:0">'+
        '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden">'+
          '<div style="display:grid;grid-template-columns:52px 1fr 150px 124px 92px 124px;padding:0 18px;height:36px;align-items:center;background:var(--neutral-25);border-bottom:1px solid var(--border-subtle);font:500 11px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)">'+
            '<div>No</div><div>Operasi</div><div>Operator</div><div>Mulai / selesai</div><div>Durasi</div><div>Status</div>'+
          '</div>'+
          rows+
          '<div style="margin-top:auto;padding:13px 18px;background:var(--neutral-25);border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:14px">'+
            '<div style="font:400 12.5px/1.4 var(--font-sans);color:var(--text-muted)">Penyelesaian rute</div>'+
            '<div style="flex:1;height:8px;border-radius:999px;background:var(--surface-sunken);overflow:hidden">'+
              '<div style="height:100%;width:'+routePct+'%;background:var(--green-500);border-radius:999px"></div>'+
            '</div>'+
            '<div style="font:500 13px/1 var(--font-mono);color:var(--text-strong)">'+routePct+'%</div>'+
          '</div>'+
        '</div>'+

        '<div style="display:flex;flex-direction:column;gap:12px;min-width:0">'+
          '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-top:3px solid '+curAccent+';border-radius:8px;box-shadow:var(--shadow-sm);padding:16px 18px">'+
            '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Operasi saat ini</div>'+
            '<div style="font:600 24px/1.2 var(--font-sans);letter-spacing:-.011em;color:var(--text-strong);margin-top:7px">'+curDef.name+'</div>'+
            '<div style="font:400 13px/1.5 var(--font-sans);color:var(--text-muted);margin-top:5px">'+stepStateLabel+' · '+operatorName()+'</div>'+
            '<div style="height:1px;background:var(--border-subtle);margin:14px 0"></div>'+
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
              '<div>'+
                '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Jam mulai</div>'+
                '<div style="font:500 14px/1.2 var(--font-mono);color:var(--text-strong);margin-top:5px">'+(curDef.start ? curDef.start+' WIB' : '—')+'</div>'+
              '</div>'+
              '<div>'+
                '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Qty baik</div>'+
                '<div style="font:500 14px/1.2 var(--font-mono);color:var(--text-strong);margin-top:5px">'+JOB.done+' pcs</div>'+
              '</div>'+
            '</div>'+
            '<div style="font:400 11.5px/1.5 var(--font-sans);color:var(--text-subtle);margin-top:12px">Jam mulai dan jam selesai ditulis otomatis oleh sistem.</div>'+
          '</div>'+

          '<div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">'+
            '<button class="btn-bright" data-act="stepPrimary" style="height:'+TOUCH_HXL+';border:1px solid transparent;border-radius:6px;background:'+stepPrimaryBg+';color:#fff;font:500 19px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:var(--transition-control)">'+ic(stepPrimaryIcon,22)+stepPrimaryLabel+'</button>'+
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
              '<button class="btn-soft2" data-act="stepPause" style="height:'+TOUCH_H+';border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-body);font:500 15px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;opacity:'+(st.running?'1':'.45')+';transition:var(--transition-control)">'+ic('pause',18)+(st.running?'Jeda':'Dijeda')+'</button>'+
              '<button class="btn-soft2" data-act="go" data-arg="home" style="height:'+TOUCH_H+';border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-muted);font:500 15px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--transition-control)">'+ic('log-out',18)+'Tinggalkan stasiun</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  /* ---------------- MATERIAL ---------------- */
  function screenMaterial(){
    var mf = frameStyle(state.matScan);
    var titles = MAT_TITLES[state.matScan] || MAT_TITLES.idle;
    var titleFg = state.matScan==='notfound' ? 'var(--brand-red-600)' : 'var(--text-strong)';
    var codeFg = state.matScan==='found' ? 'var(--green-600)'
               : state.matScan==='notfound' ? 'var(--brand-red-600)' : 'var(--text-subtle)';
    var scanning = state.matScan==='scanning';
    var online = state.online;

    var simButtons = [
      { label:'Simulasi scan — material valid',        fg:'var(--text-body)',     arg:'found' },
      { label:'Simulasi scan — kode tidak dikenali',   fg:'var(--brand-red-600)', arg:'notfound' }
    ].map(function(b){
      return '<button class="simbtn" data-act="scanMat" data-arg="'+b.arg+'" style="height:'+TOUCH_H+';border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:'+b.fg+';font:500 14px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:var(--transition-control)">'+ic('scan-line',17)+b.label+'</button>';
    }).join('');

    var left = ''+
    '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden">'+
      '<div style="padding:13px 18px;border-bottom:1px solid var(--border-subtle);font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Barcode material</div>'+
      '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px">'+
        '<div style="width:212px;height:134px;border:2px solid '+mf.border+';border-radius:6px;background:'+mf.bg+';display:flex;align-items:center;justify-content:center;transition:var(--transition-control)">'+
          '<span class="'+(scanning?'spin':'')+'">'+ic(mf.icon, 46, mf.fg)+'</span>'+
        '</div>'+
        '<div style="text-align:center">'+
          '<div style="font:500 15px/1.3 var(--font-sans);color:'+titleFg+'">'+titles[0]+'</div>'+
          '<div style="font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted);margin-top:4px;max-width:260px">'+titles[1]+'</div>'+
        '</div>'+
        '<div style="font:500 15px/1 var(--font-mono);letter-spacing:.06em;color:'+codeFg+';height:18px">'+codeFor(state.matScan, MATERIAL.code)+'</div>'+
      '</div>'+
      '<div style="padding:14px 18px;border-top:1px solid var(--border-subtle);background:var(--neutral-25);display:flex;flex-direction:column;gap:9px">'+simButtons+'</div>'+
    '</div>';

    var right;
    if (state.matScan === 'found') {
      var matFields = [
        { label:'Kode material', value:MATERIAL.code,  font:FONT_MONO },
        { label:'Nama material', value:MATERIAL.name,  font:FONT_SANS },
        { label:'Stok tersedia', value:MATERIAL.stock, font:FONT_MONO },
        { label:'Satuan',        value:MATERIAL.unit,  font:FONT_MONO }
      ].map(function(f){
        return '<div style="display:grid;grid-template-columns:126px 1fr;align-items:center;gap:10px;height:38px;padding:0 16px;border-bottom:1px solid var(--border-subtle)">'+
          '<div style="font:400 12.5px/1.3 var(--font-sans);color:var(--text-muted)">'+f.label+'</div>'+
          '<div style="font:'+f.font+';color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(f.value)+'</div>'+
        '</div>';
      }).join('');

      var issueFields = [
        { label:'Nomor job', value:JOB.no,          font:FONT_MONO },
        { label:'Produk',    value:JOB.product,     font:FONT_SANS },
        { label:'Operator',  value:operatorName(),  font:FONT_SANS },
        { label:'Waktu',     value:clockStr(),      font:FONT_MONO }
      ].map(function(f){
        return '<div style="display:grid;grid-template-columns:126px 1fr;align-items:center;gap:10px;height:38px;padding:0 16px;border-bottom:1px solid var(--border-subtle)">'+
          '<div style="font:400 12.5px/1.3 var(--font-sans);color:var(--text-muted)">'+f.label+'</div>'+
          '<div style="font:'+f.font+';color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(f.value)+'</div>'+
        '</div>';
      }).join('');

      var banner = online ? '' :
        '<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--amber-50);border:1px solid var(--amber-100);border-left:2px solid var(--amber-500);border-radius:6px">'+
          ic('cloud-off', 18, 'var(--amber-600)')+
          '<div style="font:400 13px/1.4 var(--font-sans);color:var(--amber-600)">Mode offline — '+state.queue+' transaksi menunggu di antrean. Issue material tetap bisa dilakukan dan akan dikirim saat koneksi kembali.</div>'+
        '</div>';

      right = ''+
      '<div style="min-width:0;display:flex;flex-direction:column;gap:12px;height:100%">'+
        banner+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+
          '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);overflow:hidden">'+
            '<div style="padding:11px 16px;border-bottom:1px solid var(--border-subtle);font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Material</div>'+matFields+
          '</div>'+
          '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);overflow:hidden">'+
            '<div style="padding:11px 16px;border-bottom:1px solid var(--border-subtle);font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Issue ke job</div>'+issueFields+
          '</div>'+
        '</div>'+

        '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);padding:14px 18px;display:flex;align-items:center;gap:24px">'+
          '<div>'+
            '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Kuantitas issue</div>'+
            '<div style="font:400 12.5px/1.4 var(--font-sans);color:var(--text-muted);margin-top:5px">Satuan '+MATERIAL.unit+' · stok tersedia '+MATERIAL.stock+'</div>'+
          '</div>'+
          '<div style="margin-left:auto;display:flex;align-items:center;gap:12px">'+
            '<button class="qtybtn" data-act="qtyDec" style="width:'+TOUCH_HXL+';height:'+TOUCH_HXL+';border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-strong);font:400 30px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition-control)">−</button>'+
            '<div style="min-width:120px;text-align:center;font:500 38px/1 var(--font-mono);color:var(--text-strong);letter-spacing:-.01em">'+state.qty+'</div>'+
            '<button class="qtybtn" data-act="qtyInc" style="width:'+TOUCH_HXL+';height:'+TOUCH_HXL+';border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-strong);font:400 30px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition-control)">+</button>'+
          '</div>'+
        '</div>'+

        '<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px;box-shadow:var(--shadow-sm);padding:14px 18px">'+
          '<div style="display:flex;align-items:baseline;gap:8px">'+
            '<div style="font:400 11px/1.2 var(--font-sans);letter-spacing:.07em;text-transform:uppercase;color:var(--text-subtle)">Deskripsi / catatan</div>'+
            '<div style="font:400 12px/1 var(--font-sans);color:var(--text-subtle)">Opsional — satu-satunya kolom teks bebas</div>'+
          '</div>'+
          '<textarea data-act="notes" placeholder="mis. ganti coil, batch B beda ketebalan" rows="2" style="width:100%;box-sizing:border-box;margin-top:9px;padding:10px 12px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-body);font:400 14px/1.5 var(--font-sans);resize:none;outline:none">'+esc(state.notes)+'</textarea>'+
        '</div>'+

        '<div style="margin-top:auto;display:grid;grid-template-columns:1fr 2fr;gap:12px">'+
          '<button class="btn-soft2" data-act="matReset" style="height:'+TOUCH_HXL+';border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-muted);font:500 16px/1 var(--font-sans);cursor:pointer;transition:var(--transition-control)">Batal</button>'+
          '<button class="btn-brand" data-act="matIssue" style="height:'+TOUCH_HXL+';border:1px solid transparent;border-radius:6px;background:var(--surface-brand);color:#fff;font:500 19px/1 var(--font-sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:var(--transition-control)">'+ic('package-check',22)+(online ? 'Issue material' : 'Issue material — simpan di antrean')+'</button>'+
        '</div>'+
      '</div>';
    } else if (state.matScan === 'notfound') {
      right = ''+
      '<div style="min-width:0;display:flex;flex-direction:column;height:100%">'+
        '<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-left:2px solid var(--brand-red-600);border-radius:8px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px">'+
          ic('circle-alert', 40, 'var(--brand-red-600)')+
          '<div style="font:600 20px/1.3 var(--font-sans);color:var(--text-strong);letter-spacing:-.011em">Material tidak dikenali</div>'+
          '<div style="font:400 13.5px/1.6 var(--font-sans);color:var(--text-muted);text-align:center;max-width:400px">Label terbaca tetapi kodenya tidak ada di master material. Gunakan label rak, atau laporkan ke gudang untuk pencetakan ulang.</div>'+
          '<button class="btn-soft2" data-act="matReset" style="height:'+TOUCH_H+';padding:0 26px;border:1px solid var(--border-default);border-radius:6px;background:var(--surface-card);color:var(--text-body);font:500 15px/1 var(--font-sans);cursor:pointer">Scan ulang</button>'+
        '</div>'+
      '</div>';
    } else {
      right = ''+
      '<div style="min-width:0;display:flex;flex-direction:column;height:100%">'+
        '<div style="flex:1;background:var(--surface-card);border:1px dashed var(--border-default);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px">'+
          '<span class="'+(scanning?'spin':'')+'">'+ic(scanning?'loader-circle':'package-search', 40, 'var(--neutral-300)')+'</span>'+
          '<div style="font:500 17px/1.3 var(--font-sans);color:var(--text-muted)">'+(scanning?'Menunggu data material…':'Belum ada material dimuat')+'</div>'+
          '<div style="font:400 13.5px/1.6 var(--font-sans);color:var(--text-subtle);text-align:center;max-width:380px">Scan label material. Kode, nama, stok, dan satuan diambil dari master material; nomor job diambil dari job aktif di stasiun ini.</div>'+
        '</div>'+
      '</div>';
    }

    return '<div style="display:grid;grid-template-columns:376px 1fr;gap:16px;height:100%">'+left+right+'</div>';
  }

  /* ---------------- render ---------------- */
  function render(){
    var body;
    if (state.screen === 'home') body = screenHome();
    else if (state.screen === 'job') body = screenJob();
    else if (state.screen === 'progress') body = screenProgress();
    else body = screenMaterial();

    $('#frame').innerHTML =
      headerHtml() + navHtml() +
      '<main style="flex:1;min-height:0;overflow:hidden;padding:18px 24px;background:var(--surface-app)">' + body + '</main>';

    if (window.lucide) lucide.createIcons();
  }

  function renderToast(){
    var el = $('#toast');
    var t = state.toast;
    if (!t){ el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    el.setAttribute('style',
      'position:absolute;right:24px;bottom:24px;display:flex;align-items:flex-start;gap:12px;'+
      'padding:14px 18px;background:var(--neutral-900);color:#fff;border-radius:8px;'+
      'box-shadow:var(--shadow-lg);max-width:440px;z-index:50');
    el.innerHTML =
      ic(t.icon, 20, t.iconFg) +
      '<div>'+
        '<div style="font:500 14px/1.3 var(--font-sans)">'+esc(t.title)+'</div>'+
        '<div style="font:400 12.5px/1.45 var(--font-sans);color:var(--neutral-400);margin-top:2px">'+esc(t.body)+'</div>'+
      '</div>';
    if (window.lucide) lucide.createIcons();
  }

  function showToast(title, body, icon, iconFg){
    clearTimeout(toastTimer);
    state.toast = { title:title, body:body, icon:icon || 'circle-check', iconFg:iconFg || 'var(--green-500)' };
    renderToast();
    toastTimer = setTimeout(function(){ state.toast = null; renderToast(); }, 3600);
  }

  /* ---------------- best-effort server sync (silent) ---------------- */
  function post(url, payload){
    try{
      fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(payload) })
        .catch(function(){});
    }catch(e){}
  }

  /* ---------------- actions ---------------- */
  function doScan(which, result){
    var k = which === 'job' ? 'jobScan' : 'matScan';
    if (state[k] === 'scanning') return;
    clearTimeout(scanTimer);
    state[k] = 'scanning';
    render();
    scanTimer = setTimeout(function(){ state[k] = result; render(); }, 1100);
  }

  var actions = {
    toggleConn: function(){ state.online = !state.online; },
    go: function(arg){ state.screen = arg; },
    role: function(arg){
      var r = ROLES.filter(function(x){ return x.key === arg; })[0];
      state.role = arg;
      if (r.screens.indexOf(state.screen) === -1) state.screen = r.screens[0];
    },
    scanJob: function(arg){ doScan('job', arg); },
    scanMat: function(arg){ doScan('mat', arg); },
    jobReset: function(){ state.jobScan = 'idle'; },
    matReset: function(){ state.matScan = 'idle'; state.notes = ''; state.qty = 6; },
    qtyInc: function(){ state.qty = Math.min(999, state.qty + 1); },
    qtyDec: function(){ state.qty = Math.max(1, state.qty - 1); },
    jobTakeover: function(){
      showToast('Permintaan alih stasiun dikirim', 'Menunggu persetujuan supervisor Line 02.', 'user-round-check', 'var(--blue-500)');
    },
    jobFinish: function(){
      state.screen = 'progress';
      showToast('Job belum bisa diselesaikan', 'QC masih menunggu — selesaikan rute operasi lebih dulu.', 'triangle-alert', 'var(--amber-500)');
    },
    stepPrimary: function(){
      var st = state;
      var curDef = STEP_DEFS[st.currentStep] || STEP_DEFS[STEP_DEFS.length-1];
      if (st.running){
        var last = st.currentStep >= STEP_DEFS.length - 1;
        st.currentStep = Math.min(st.currentStep + 1, STEP_DEFS.length - 1);
        st.running = false;
        st.stepSeconds = 0;
        showToast(
          last ? 'Rute operasi selesai' : curDef.name + ' selesai',
          last ? JOB.no + ' siap ditutup.' : 'Jam selesai ' + clockStr() + ' ditulis otomatis.'
        );
        post('/api/jobs', {
          job_id:JOB.no, customer:JOB.customer, product:JOB.product,
          qty_target:1500, qty_completed:940,
          status: last ? 'ROUTE_DONE' : ('STEP_DONE:' + curDef.name.toUpperCase())
        });
      } else {
        st.running = true;
        showToast(curDef.name + ' dimulai', 'Jam mulai ' + clockStr() + ' ditulis otomatis.');
      }
    },
    stepPause: function(){
      if (state.running){
        state.running = false;
        showToast('Operasi dijeda', 'Jeda tercatat ' + clockStr() + '.', 'pause', 'var(--violet-500)');
      }
    },
    matIssue: function(){
      var st = state;
      if (st.online){
        showToast(
          st.qty + ' ' + MATERIAL.unit + ' di-issue ke ' + JOB.no,
          MATERIAL.code + ' · tercatat ' + clockStr() + ' oleh ' + operatorName()
        );
        post('/api/issues', {
          lot_id:MATERIAL.code, issue_type:'MATERIAL_ISSUE', severity:'info',
          affected_qty:st.qty, notes:st.notes, operator_id:operatorName()
        });
      } else {
        st.queue += 1;
        showToast(
          'Disimpan di antrean offline',
          st.qty + ' ' + MATERIAL.unit + ' akan dikirim otomatis saat koneksi kembali.',
          'cloud-off', 'var(--amber-500)'
        );
      }
      st.matScan = 'idle'; st.notes = ''; st.qty = 6;
    }
  };

  /* ---------------- events ---------------- */
  function onClick(e){
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = actions[el.getAttribute('data-act')];
    if (!fn) return;
    fn(el.getAttribute('data-arg'));
    render();
    renderToast();
  }
  function onInput(e){
    var el = e.target.closest('[data-act="notes"]');
    if (el) state.notes = el.value;
  }

  function tick(){
    state.now = new Date(state.now.getTime() + 1000);
    if (state.running) state.stepSeconds += 1;
    if (state.screen === 'progress'){
      render();
    } else {
      var els = document.querySelectorAll('.js-clock');
      for (var i = 0; i < els.length; i++) els[i].textContent = clockStr();
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    var parts = (location.hash || '').replace('#', '').split('/');
    var h = parts[0];
    if (['home', 'job', 'progress', 'material'].indexOf(h) !== -1){
      if (roleObj().screens.indexOf(h) === -1) state.role = 'admin';
      state.screen = h;
      if (h === 'job' && parts[1]) state.jobScan = parts[1];
      if (h === 'material' && parts[1]) state.matScan = parts[1];
    }
    render();
    renderToast();
    var f = $('#frame');
    f.addEventListener('click', onClick);
    f.addEventListener('input', onInput);
    setInterval(tick, 1000);
  });
})();
</script>
</body>
</html>
