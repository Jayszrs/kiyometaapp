name: kiyometa

# Backend is Supabase cloud (see VITE_SUPABASE_URL in .env), so only the
# webapp and the OCR sidecar run on this server.
services:
  ocr:
    build:
      context: ./ocr-fix
    image: kiyometa-ocr-fixed
    container_name: kiyometa-ocr
    restart: unless-stopped
    environment:
      MAX_PDF_PAGES: 3
      MAX_UPLOAD_MB: 25
      OCR_MAX_CONCURRENT: 2
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_JWKS_URL: ${VITE_SUPABASE_URL}/auth/v1/.well-known/jwks.json
    mem_limit: 2500m
    networks: [kiyometa]

  orders-webapp:
    container_name: kiyometa-orders-webapp
    build:
      context: ../app/webapp
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORDERS_WEBAPP_PORT}:80"
    volumes:
      - ./nginx-kiyometa.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [kiyometa]

networks:
  kiyometa:
    driver: bridge
