# Kiyometa webapp: static SPA + same-origin reverse proxy to the OCR service.
map $http_cf_connecting_ip $ocr_limit_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $ocr_limit_key zone=ocr:1m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 26m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/ocr(/|$) {
        set $ocr_upstream http://ocr:8787;
        proxy_pass $ocr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        limit_req zone=ocr burst=5 nodelay;
        limit_req_status 429;
    }

    # index.html must always be revalidated so a new deploy shows up on reload;
    # hashed bundles under /assets/ never change and can be cached forever.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
